<!-- farmer.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Farmer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-image: url('https://images.unsplash.com/photo-1560493676-04071c5f467b?q=80&w=1974&auto=format&fit=crop');
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat; 
            background-attachment: fixed; 
        }
    </style>
</head>
<body class="min-h-screen">

    <!-- Header (same as aggregator) -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <img 
                   src="farmledger.jpeg" 
                   alt="FarmLedgers Logo"
                   class="h-10 w-auto object-contain"
                />

                <a href="home.html" class="text-2xl font-bold text-gray-800">FarmLedgers</a>
            </div>
            <div class="hidden md:flex items-center space-x-8">
                <a href="home.html" class="text-green-700 text-lg font-semibold">Home</a>
                <a href="#" class="text-green-700 text-lg font-semibold">About Us</a>
                <a href="login.html" class="text-green-700 text-lg font-semibold">Log In</a>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <div class="flex items-center justify-center min-h-screen p-4 pt-28">
        <div class="w-full max-w-lg mx-auto bg-white/90 backdrop-blur-sm p-8 rounded-xl shadow-lg">

            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800">Farmer</h1>
                <p class="text-gray-600 mt-2">Enter farmer and crop authenticity details</p>
            </div>

            <!-- Farmer Form -->
            <form id="farmerForm" novalidate>
                <div class="space-y-6">

                    <!-- Farmer ID -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Farmer ID (Hashed)</label>
                        <input type="text" id="farmerId" readonly placeholder="Auto-generated / Hashed ID" class="w-full px-4 py-2 border rounded-lg bg-gray-100 cursor-not-allowed">
                    </div>

                    <!-- Farm Region -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Farm Region (Taluka / District)</label>
                        <input type="text" required placeholder="e.g. Paithan, Sambhajinagar" class="w-full px-4 py-2 border rounded-lg">
                    </div>

                    <!-- Cultivation Method -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Cultivation Method</label>
                        <select required class="w-full px-4 py-2 border rounded-lg">
                            <option value="">Select Method</option>
                            <option>Organic</option>
                            <option>Conventional</option>
                            <option>Hybrid</option>
                        </select>
                    </div>

                    <hr class="my-4">

                    <!-- Crop Variety Code -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Crop Variety Code</label>
                        <input type="text" required placeholder="e.g. WHT-204" class="w-full px-4 py-2 border rounded-lg">
                    </div>

                    <!-- Harvest Window -->
                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Harvest Start Date</label>
                            <input type="date" required class="w-full px-4 py-2 border rounded-lg">
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Harvest End Date</label>
                            <input type="date" required class="w-full px-4 py-2 border rounded-lg">
                        </div>
                    </div>

                    <!-- Natural Risk Exposure -->
                    <div>
                        <label class="block text-sm font-medium text-gray-700 mb-1">Natural Risk Exposure Index</label>
                        <input type="text" placeholder="Rainfall deviation / Heat stress score" class="w-full px-4 py-2 border rounded-lg">
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="mt-8">
                    <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition">
                        Submit Farmer Data
                    </button>
                </div>
            </form>
        </div>
    </div>
        <!-- Footer -->
    <footer class="bg-gray-800 text-white py-12">
        <div class="container mx-auto px-6 text-center">
            <div class="flex justify-center items-center space-x-2 mb-4">
                <img 
           src="farmledger.jpeg" 
          alt="FarmLedgers Logo"
         class="h-10 w-auto object-contain"
        />
                <h4 class="text-lg font-semibold">FarmLedgers</h4>
            </div>
            <p class="text-gray-400 mb-6">Simplifying Farm Management.</p>
            <div class="flex justify-center space-x-6">
                <a href="#" class="text-gray-400 hover:text-white"><i class="fab fa-facebook-f text-xl"></i></a>
                <a href="#" class="text-gray-400 hover:text-white"><i class="fab fa-instagram text-xl"></i></a>
                <a href="#" class="text-gray-400 hover:text-white"><i class="fab fa-twitter text-xl"></i></a>
            </div>
            <div class="border-t border-gray-700 mt-8 pt-6">
                <p class="text-gray-500">&copy; 2026 FarmLedgers. All Rights Reserved.</p>
            </div>
        </div>
    </footer>


    <script>
        // Auto-generate Farmer ID (hashed-like)
        function generateFarmerId() {
            const timestamp = Date.now().toString(36);
            const randomPart = Math.random().toString(36).substring(2, 10);
            return `FRM-${timestamp}-${randomPart}`.toUpperCase();
        }

        document.addEventListener('DOMContentLoaded', () => {
            const farmerIdInput = document.getElementById('farmerId');
            if (farmerIdInput) {
                farmerIdInput.value = generateFarmerId();
            }
        });
    </script>

</body>
</html>
