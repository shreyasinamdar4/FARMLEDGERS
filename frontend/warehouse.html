<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Warehouse Registration</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      margin: 0;
      padding: 0;
      background-image: url(https://tse3.mm.bing.net/th/id/OIP.GUsYiYATfzGGR2lgcjYLwwHaEJ?rs=1&pid=ImgDetMain&o=7&rm=3);
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
      min-height: 100vh;
    }

    .overlay {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(3px);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.2);
    }
  </style>
</head>

<body class="min-h-screen">

  <!-- Header -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
      <div class="flex items-center space-x-2">
        <img src="assets/images/farmledger.jpeg" alt="FarmLedgers Logo" class="h-10 w-auto object-contain" />
        <a href="home.html" class="text-2xl font-bold" style="color: #1F2937;">FarmLedgers</a>
      </div>
      <div class="hidden md:flex items-center space-x-8">
        <a href="home.html" class="text-green-700 text-lg font-semibold hover:text-green-800">Home</a>
        <a href="#about-us-section" class="text-green-700 text-lg font-semibold hover:text-green-800">About Us</a>
        <a href="login.html" class="text-green-700 text-lg font-semibold hover:text-green-800">Log In</a>
      </div>
      <button id="mobile-menu-button" class="md:hidden">
        <i class="fas fa-bars text-green-700 text-2xl"></i>
      </button>
    </nav>
    <div id="mobile-menu" class="md:hidden hidden px-6 pb-4">
      <a href="home.html" class="block py-2 text-green-700 text-lg font-semibold hover:text-green-800">Home</a>
      <a href="#about-us-section" class="block py-2 text-green-700 text-lg font-semibold hover:text-green-800">About Us</a>
      <a href="login.html" class="block mt-2 text-center text-green-700 text-lg font-semibold hover:text-green-800">Log In</a>
    </div>
  </header>

  <!-- Main Content -->
  <div class="flex items-center justify-center min-h-screen p-4 pt-28">
    <div class="w-full max-w-lg overlay">
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800">Warehouse Storage</h1>
        <p class="text-gray-600 mt-2">Storage environment data</p>
      </div>

      <form id="warehouseForm" class="space-y-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Batch ID</label>
          <input type="text" id="batchId" readonly class="w-full px-4 py-2 border rounded-lg bg-gray-100 cursor-not-allowed">
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Quantity Received in Warehouse</label>
          <input type="number" id="quantityReceived" placeholder="e.g. 480" class="w-full px-4 py-2 border rounded-lg" required>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Source of Product</label>
          <input type="text" id="sourceProduct" placeholder="e.g. AGG-102" class="w-full px-4 py-2 border rounded-lg" required>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Entry Date & Time</label>
          <input type="datetime-local" id="entryDateTime" class="w-full px-4 py-2 border rounded-lg" required>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Total Duration Stored (Days)</label>
          <input type="number" id="durationStored" placeholder="e.g. 12" class="w-full px-4 py-2 border rounded-lg" required>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Quantity Dispatched</label>
          <input type="number" id="quantityDispatched" placeholder="e.g. 450" class="w-full px-4 py-2 border rounded-lg" required>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Exit Date & Time</label>
          <input type="datetime-local" id="exitDateTime" class="w-full px-4 py-2 border rounded-lg" required>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Storage Zone</label>
          <select id="storageZone" class="w-full px-4 py-2 border rounded-lg" required>
            <option value="">Select Zone</option>
            <option value="Cold">Cold</option>
            <option value="Dry">Dry</option>
            <option value="Ambient">Ambient</option>
          </select>
        </div>

        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Temperature (°C)</label>
          <input type="number" id="temperature" placeholder="e.g. 5.5" class="w-full px-4 py-2 border rounded-lg" required>
        </div>

        <button type="submit" class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition">
          Submit Storage Data
        </button>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener("DOMContentLoaded", () => {
      const batchId = document.getElementById("batchId");
      const warehouseForm = document.getElementById("warehouseForm");

      // Pre-fill batchId
      batchId.value = localStorage.getItem("batchId") || "";

      warehouseForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const data = {
          batchId: batchId.value,
          quantityReceived: parseFloat(document.getElementById("quantityReceived").value),
          sourceProduct: document.getElementById("sourceProduct").value,
          entryDateTime: document.getElementById("entryDateTime").value,
          durationStored: parseInt(document.getElementById("durationStored").value),
          quantityDispatched: parseFloat(document.getElementById("quantityDispatched").value),
          exitDateTime: document.getElementById("exitDateTime").value,
          storageZone: document.getElementById("storageZone").value,
          temperature: parseFloat(document.getElementById("temperature").value)
        };

        try {
          const res = await fetch("http://localhost:3000/api/warehouse", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(data)
          });

          const result = await res.json();
          alert(result.message);

          warehouseForm.reset();
          batchId.value = localStorage.getItem("batchId"); // reset batchId
        } catch (err) {
          console.error(err);
          alert("Error submitting warehouse data");
        }
      });
    });
  </script>

</body>
</html>
