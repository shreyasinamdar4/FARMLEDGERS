<!-- retailer.html -->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Retailer | FarmLedgers</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">

    <style>
        body { 
            font-family: 'Inter', sans-serif; 
            background-image: url('https://images.unsplash.com/photo-1560493676-04071c5f467b?q=80&w=1974&auto=format&fit=crop');
            background-size: cover; 
            background-position: center;
            background-repeat: no-repeat; 
            background-attachment: fixed; 
        }
    </style>
</head>
<body class="min-h-screen"> 

    <!-- Header -->
    <header class="bg-white shadow-md sticky top-0 z-50">
        <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
            <div class="flex items-center space-x-2">
                <img src="assets/images/farmledger.jpeg" alt="FarmLedgers Logo" class="h-10 w-auto object-contain">
                <a href="home.html" class="text-2xl font-bold text-gray-800">FarmLedgers</a>
            </div>
            <div class="hidden md:flex items-center space-x-8">
                <a href="home.html" class="text-green-700 text-lg font-semibold">Home</a>
                <a href="#" class="text-green-700 text-lg font-semibold">About Us</a>
                <a href="login.html" class="text-green-700 text-lg font-semibold">Log In</a>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <div class="flex items-center justify-center min-h-screen p-4 pt-28">
        <div class="w-full max-w-lg bg-white/90 p-8 rounded-xl shadow-lg">

            <div class="text-center mb-8">
                <h1 class="text-3xl font-bold text-gray-800">Retail Stage</h1>
                <p class="text-gray-600 mt-2">Retail quality & stock decision</p>
            </div>

            <form id="retailForm" class="space-y-6">

                <!-- Batch ID -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Batch ID</label>
                    <input type="text" id="batchId" readonly
                        class="w-full px-4 py-2 border rounded-lg bg-gray-100 cursor-not-allowed">
                </div>

                <!-- Product Name -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Product Name</label>
                    <input type="text" id="storeName" required placeholder="e.g. Organic Tomato"
                        class="w-full px-4 py-2 border rounded-lg">
                </div>

                <!-- Product Category -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Product Category</label>
                    <input type="text" required placeholder="Vegetable / Fruit"
                        class="w-full px-4 py-2 border rounded-lg">
                </div>

                <!-- Arrival Condition Grade -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Arrival Condition Grade</label>
                    <select required class="w-full px-4 py-2 border rounded-lg">
                        <option value="">Select</option>
                        <option>A</option>
                        <option>B</option>
                        <option>C</option>
                    </select>
                </div>

                <!-- Date Received -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Date Received at Retail</label>
                    <input type="datetime-local" id="arrivalTime" required
                        class="w-full px-4 py-2 border rounded-lg">
                </div>

                <!-- Remaining Shelf Life -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Remaining Shelf Life (Days)</label>
                    <input type="number" id="quantityReceived" required placeholder="e.g. 480"
                        class="w-full px-4 py-2 border rounded-lg">
                </div>

                <!-- QR Data Package Version -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">QR Data Package Version</label>
                    <input type="text" value="v1.0" readonly
                        class="w-full px-4 py-2 border rounded-lg bg-gray-100 cursor-not-allowed">
                </div>

                <!-- Retail Rejection Reason -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">
                        Retail Rejection Reason (if any)
                    </label>
                    <input type="text" placeholder="Optional"
                        class="w-full px-4 py-2 border rounded-lg">
                </div>

                <!-- Stock Priority -->
                <div>
                    <label class="block text-sm font-medium text-gray-700 mb-1">Stock Priority Label</label>
                    <select required class="w-full px-4 py-2 border rounded-lg">
                        <option value="">Select</option>
                        <option>Sell First</option>
                        <option>Hold</option>
                        <option>Discard</option>
                    </select>
                </div>

                <button type="submit"
                    class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700 transition">
                    Submit Retail Data
                </button>

            </form>
        </div>
    </div>

    <!-- Footer -->
    <footer class="bg-gray-800 text-white py-12">
        <div class="container mx-auto px-6 text-center">
            <div class="flex justify-center items-center space-x-2 mb-4">
                <img src="assets/images/farmledger.jpeg" alt="FarmLedgers Logo" class="h-10 w-auto object-contain"/>
                <h4 class="text-lg font-semibold">FarmLedgers</h4>
            </div>
            <p class="text-gray-400 mb-6">Simplifying Farm Management.</p>
            <div class="flex justify-center space-x-6">
                <a href="#" class="text-gray-400 hover:text-white"><i class="fab fa-facebook-f text-xl"></i></a>
                <a href="#" class="text-gray-400 hover:text-white"><i class="fab fa-instagram text-xl"></i></a>
                <a href="#" class="text-gray-400 hover:text-white"><i class="fab fa-twitter text-xl"></i></a>
            </div>
            <div class="border-t border-gray-700 mt-8 pt-6">
                <p class="text-gray-500">&copy; 2026 FarmLedgers. All Rights Reserved.</p>
            </div>
        </div>
    </footer>

    <!-- Retail Form Script -->
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const batchIdInput = document.getElementById("batchId");
            const retailForm = document.getElementById("retailForm");

            // Load batch ID
            batchIdInput.value = localStorage.getItem("batchId") || "";

            // Form submission
            retailForm.addEventListener("submit", async (e) => {
                e.preventDefault();
                const batchId = batchIdInput.value.trim();
                const storeName = document.getElementById("storeName").value;
                const quantityReceived = document.getElementById("quantityReceived").value;
                const arrivalTime = document.getElementById("arrivalTime").value;

                try {
                    const res = await fetch("/api/retailer", {
                        method: "POST",
                        headers: { "Content-Type": "application/json" },
                        body: JSON.stringify({
                            batch_id: batchId,
                            store_name: storeName,
                            quantity_received: quantityReceived,
                            arrival_time: arrivalTime
                        }),
                    });
                    const data = await res.json();
                    if (res.ok) {
                        alert("Retailer data saved!");
                    } else {
                        alert("Error: " + data.error);
                    }
                } catch (err) {
                    console.error(err);
                    alert("Failed to submit data.");
                }
            });
        });
    </script>

</body>
</html>
