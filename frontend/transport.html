<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Transport / Logistics</title>

<script src="https://cdn.tailwindcss.com"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

<style>
body {
  font-family: 'Inter', sans-serif;
  background-image: url('https://images.unsplash.com/photo-1601584115197-04ecc0da31d7?q=80&w=1974&auto=format&fit=crop');
  background-size: cover;
  background-position: center;
  background-attachment: fixed;
}
</style>
</head>

<body class="min-h-screen">

<!-- Header -->
<header class="bg-white shadow-md sticky top-0 z-50">
<nav class="container mx-auto px-6 py-4 flex justify-between items-center">
<div class="flex items-center space-x-2">
<img src="assets/images/farmledger.jpeg" class="h-10">
<a href="home.html" class="text-2xl font-bold text-gray-800">FarmLedgers</a>
</div>
</nav>
</header>

<!-- Main -->
<div class="flex items-center justify-center min-h-screen p-4 pt-28">
<div class="w-full max-w-lg bg-white/90 p-8 rounded-xl shadow-lg">

<div class="text-center mb-8">
<h1 class="text-3xl font-bold">Transport / Logistics</h1>
<p class="text-gray-600 mt-2">Enter transport and cold-chain details</p>
</div>

<form id="transportForm" class="space-y-6">

<!-- Batch ID -->
<div>
<label class="block text-sm font-medium mb-1">Batch ID</label>
<input id="batchId" readonly
class="w-full px-4 py-2 border rounded-lg bg-gray-100">
</div>

<!-- From -->
<div>
<label class="block text-sm font-medium mb-1">From Location</label>
<select id="fromLoc" required class="w-full px-4 py-2 border rounded-lg">
<option value="">Select Source</option>
<option>Aggregator</option>
<option>Warehouse</option>
</select>
</div>

<!-- To -->
<div>
<label class="block text-sm font-medium mb-1">To Location</label>
<select id="toLoc" required class="w-full px-4 py-2 border rounded-lg">
<option value="">Select Destination</option>
<option>Warehouse</option>
<option>Retailer</option>
</select>
</div>

<!-- Vehicle -->
<div>
<label class="block text-sm font-medium mb-1">Vehicle ID</label>
<input id="vehicle" required
class="w-full px-4 py-2 border rounded-lg">
</div>

<!-- Vehicle Type -->
<div>
<label class="block text-sm font-medium mb-1">Vehicle Type</label>
<select id="vehicleType" required
class="w-full px-4 py-2 border rounded-lg">
<option value="">Select Type</option>
<option>Refrigerated</option>
<option>Non-Refrigerated</option>
</select>
</div>

<!-- Transit Times -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-4">
<div>
<label class="block text-sm font-medium mb-1">Transit Start</label>
<input id="startTime" type="datetime-local" required
class="w-full px-4 py-2 border rounded-lg">
</div>

<div>
<label class="block text-sm font-medium mb-1">Transit End</label>
<input id="endTime" type="datetime-local" required
class="w-full px-4 py-2 border rounded-lg">
</div>
</div>

<!-- Temperature -->
<div>
<label class="block text-sm font-medium mb-1">Temperature Stability Score</label>
<input id="tempScore" type="number" step="0.1" required
class="w-full px-4 py-2 border rounded-lg">
</div>

<!-- Expected Arrival -->
<div>
<label class="block text-sm font-medium mb-1">Expected Arrival</label>
<input id="arrivalTime" type="datetime-local" required
class="w-full px-4 py-2 border rounded-lg">
</div>

<!-- Submit -->
<div class="mt-8">
<button type="submit"
class="w-full bg-green-600 text-white font-bold py-3 rounded-lg hover:bg-green-700">
Submit Transport Data
</button>
</div>

</form>
</div>
</div>

<footer class="bg-gray-800 text-white py-6 text-center">
<p>© 2026 FarmLedgers</p>
</footer>

<script>
document.getElementById("batchId").value =
    localStorage.getItem("batchId") || "";

document.getElementById("transportForm")
.addEventListener("submit", async e => {
e.preventDefault();

const payload = {
batchId: batchId.value,
fromLoc: fromLoc.value,
toLoc: toLoc.value,
vehicle: vehicle.value,
vehicleType: vehicleType.value,
startTime: startTime.value,
endTime: endTime.value,
tempScore: tempScore.value,
arrivalTime: arrivalTime.value
};

const res = await fetch("/api/transport", {
method: "POST",
headers: {"Content-Type":"application/json"},
body: JSON.stringify(payload)
});

const data = await res.json();
alert(data.message || "Transport saved");
});
</script>

</body>
</html>
