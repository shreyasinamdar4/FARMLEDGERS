<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Agri Aggregator</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Font Awesome for icons -->
  <script src="https://kit.fontawesome.com/a076d05399.js" crossorigin="anonymous"></script>
  <!-- Google Fonts: Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
    rel="stylesheet"
  >
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css">
  <style>
    body {
      font-family: 'Inter', sans-serif;
      background-image: url('https://images.unsplash.com/photo-1625246333195-78d9c38ad449?q=80&w=2070&auto=format&fit=crop');
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      background-attachment: fixed;
    }

    @keyframes sway {
      0%, 100% { transform: rotate(-5deg); }
      50% { transform: rotate(5deg); }
    }
    .animated-leaf {
      animation: sway 3s ease-in-out infinite;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col">

  <!-- Header -->
  <header class="bg-white shadow-md sticky top-0 z-50">
    <nav class="container mx-auto px-6 py-4 flex justify-between items-center">
      <!-- Brand Logo -->
      <div class="flex items-center space-x-2">
        <img 
           src="assets/images/farmledger.jpeg" 
          alt="FarmLedgers Logo"
         class="h-10 w-auto object-contain"
        />

        <a href="home.html" class="text-2xl font-bold" style="color: #1F2937;">FarmLedgers</a>
      </div>

      <!-- Desktop Navigation Links -->
      <div class="hidden md:flex items-center space-x-8">
        <a href="home.html" class="text-green-700 text-lg font-semibold transition duration-300 transform hover:scale-110 hover:text-green-800">Home</a>
        <a href="#about-us-section" class="text-green-700 text-lg font-semibold transition duration-300 transform hover:scale-110 hover:text-green-800">About Us</a>
        <a href="login.html" class="text-green-700 text-lg font-semibold transition duration-300 transform hover:scale-110 hover:text-green-800">Log In</a>
      </div>

      <!-- Mobile Menu Button -->
      <button id="mobile-menu-button" class="md:hidden">
        <i class="fas fa-bars text-green-700 text-2xl"></i>
      </button>
    </nav>

    <!-- Mobile Menu -->
    <div id="mobile-menu" class="md:hidden hidden px-6 pb-4">
      <a href="home.html" class="block py-2 text-green-700 text-lg font-semibold transform hover:scale-105 hover:text-green-800 transition duration-300">Home</a>
      <a href="#about-us-section" class="block py-2 text-green-700 text-lg font-semibold transform hover:scale-105 hover:text-green-800 transition duration-300">About Us</a>
      <a href="login.html" class="block mt-2 text-center text-green-700 text-lg font-semibold transform hover:scale-105 hover:text-green-800 transition duration-300">Log In</a>
    </div>
  </header>

  <!-- Main Content -->
  <main class="flex-grow flex items-center justify-center p-4">
    <div class="w-full max-w-md mx-auto bg-white/90 backdrop-blur-sm p-8 rounded-xl shadow-lg">
         <div class="text-center mb-6">
        <div
          class="mx-auto h-28 w-28 rounded-full overflow-hidden shadow-lg hover:scale-105 transition-transform duration-300">
          <img src="assets/images/farmledger.jpeg" alt="FarmLedgers Logo" class="h-full w-full object-cover">
        </div>
      </div>

      <!-- Header -->
      <div class="text-center mb-8">
        <h1 class="text-3xl font-bold text-gray-800">Welcome Back!</h1>
        <p class="text-gray-600 mt-2">Sign in to continue to your account.</p>
      </div>

      <!-- Login Form -->
      <form id="loginForm" novalidate>
        <div class="space-y-6">
          <!-- User ID -->
          <div>
            <label for="userid" class="block text-sm font-medium text-gray-700 mb-1">User ID</label>
            <input type="text" id="userid" name="userid" required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 transition duration-200"
              placeholder="Enter your User ID">
          </div>

          <!-- Password -->
          <div>
            <label for="password" class="block text-sm font-medium text-gray-700 mb-1">Password</label>
            <input type="password" id="password" name="password" required
              class="w-full px-4 py-2 border border-gray-300 rounded-lg focus:ring-2 focus:ring-green-500 focus:border-green-500 transition duration-200"
              placeholder="••••••••">
          </div>
        </div>

        <!-- Submit Button -->
        <div class="mt-8">
          <button type="submit"
            class="w-full bg-green-600 text-white font-bold py-3 px-4 rounded-lg hover:bg-green-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-green-500 transition duration-300 ease-in-out">
            Sign In
          </button>
        </div>
      </form>
    </div>
  </main>

  <!-- Footer -->
  <footer class="bg-gray-800 text-white py-12">
    <div class="container mx-auto px-6 text-center">
      <div class="flex justify-center items-center space-x-2 mb-4">
        <img 
           src="assets/images/farmledger.jpeg" 
          alt="FarmLedgers Logo"
         class="h-10 w-auto object-contain"
        />
        <h4 class="text-lg font-semibold">FarmLedgers</h4>
      </div>
      <p class="text-gray-400 mb-6">Simplifying Farm Management.</p>
      <div class="flex justify-center space-x-6">
        <a href="#" class="text-gray-400 hover:text-white"><i class="fab fa-facebook-f text-xl"></i></a>
        <a href="#" class="text-gray-400 hover:text-white"><i class="fab fa-instagram text-xl"></i></a>
        <a href="#" class="text-gray-400 hover:text-white"><i class="fab fa-twitter text-xl"></i></a>
      </div>
      <div class="border-t border-gray-700 mt-8 pt-6">
        <p class="text-gray-500">&copy; 2026 FarmLedgers. All Rights Reserved.</p>
      </div>
    </div>
  </footer>

  <script>
  const loginForm = document.getElementById('loginForm');
  const mobileMenuButton = document.getElementById('mobile-menu-button');
  const mobileMenu = document.getElementById('mobile-menu');

  // Toggle mobile menu
  mobileMenuButton.addEventListener('click', () => {
    mobileMenu.classList.toggle('hidden');
  });

  // User credentials
  const users = {  
    "janhavidahale04@gmail.com": { password: "Janhavi25", page: "aggregator.html" },
    "shreyasinamdar4@gmail.com": { password: "Shreyas04", page: "transport.html" },
    "ritesh412004@gmail.com": { password: "Ritesh04", page: "farmer.html" },
    "harshadaaghade16@gmail.com": { password: "Harshada16", page: "warehouse.html" },
    "anjalikamble08@gmail.com": { password: "Anjali08", page: "retailer.html"} ,
    "harshadatuke01@gmail.com" : {password: "harshada",page: "admin.html"}
  };

  // Login logic
  loginForm.addEventListener('submit', function (event) {
    event.preventDefault();

    const userid = document.getElementById("userid").value.trim();
    const password = document.getElementById("password").value.trim();

    if (users[userid] && users[userid].password === password) {
      // Redirect to assigned page
      window.location.href = users[userid].page;
    } else {
      alert("Invalid User ID or Password!");
    }
  });
</script>

</body>
</html>
